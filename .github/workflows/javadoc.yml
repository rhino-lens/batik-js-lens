name: Publish Javadoc

# Builds the Javadoc for each release and publishes it to GitHub Pages
# (enable Pages with source "GitHub Actions"; Pages on a private repository needs a paid plan).
on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  javadoc:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
      - name: Build Javadoc
        run: mvn -B javadoc:javadoc
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/reports/apidocs
      - id: deploy
        uses: actions/deploy-pages@v4
